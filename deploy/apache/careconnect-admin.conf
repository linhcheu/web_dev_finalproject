# CareConnect admin panel (platform admins) - Laravel app in /backend
# http://YOUR_SERVER_IP:8080/
#
#   cp /var/www/careconnect/deploy/apache/careconnect-admin.conf /etc/apache2/sites-available/
#   a2ensite careconnect-admin.conf
#   ufw allow 8080/tcp

# Port 80 is already in ports.conf; this one must be added.
Listen 8080

<VirtualHost *:8080>
    DocumentRoot /var/www/careconnect/backend/public

    <Directory /var/www/careconnect/backend/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Pictures uploaded through the API (profile + hospital photos).
    # Served as plain files: PHP is switched off in this folder.
    Alias /storage /var/www/careconnect/api/storage/app/public
    <Directory /var/www/careconnect/api/storage/app/public>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted
        <FilesMatch "\.(php|phar|phtml|php[0-9])$">
            Require all denied
        </FilesMatch>
        <IfModule mod_php.c>
            php_admin_flag engine off
        </IfModule>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/careconnect_admin_error.log
    CustomLog ${APACHE_LOG_DIR}/careconnect_admin_access.log combined
</VirtualHost>
