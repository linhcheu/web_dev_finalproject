# CareConnect website (patients + hospital admins) - Laravel app in /frontend
# http://YOUR_SERVER_IP/
#
#   cp /var/www/careconnect/deploy/apache/careconnect.conf /etc/apache2/sites-available/
#   a2ensite careconnect.conf

<VirtualHost *:80>
    DocumentRoot /var/www/careconnect/frontend/public

    <Directory /var/www/careconnect/frontend/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Pictures uploaded through the API (profile + hospital photos).
    # Served as plain files: PHP is switched off in this folder.
    Alias /storage /var/www/careconnect/api/storage/app/public
    <Directory /var/www/careconnect/api/storage/app/public>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted
        <FilesMatch "\.(php|phar|phtml|php[0-9])$">
            Require all denied
        </FilesMatch>
        <IfModule mod_php.c>
            php_admin_flag engine off
        </IfModule>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/careconnect_error.log
    CustomLog ${APACHE_LOG_DIR}/careconnect_access.log combined
</VirtualHost>
