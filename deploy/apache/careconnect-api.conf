# CareConnect API (Laravel app in /api) - the ONLY app that talks to MySQL.
# Listens on 127.0.0.1:8081: reachable from this server only (the website and
# admin panel call it), NOT from the internet. No ufw rule is needed for it.
#
#   cp /var/www/careconnect/deploy/apache/careconnect-api.conf /etc/apache2/sites-available/
#   a2ensite careconnect-api.conf

Listen 127.0.0.1:8081

<VirtualHost 127.0.0.1:8081>
    DocumentRoot /var/www/careconnect/api/public

    <Directory /var/www/careconnect/api/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/careconnect_api_error.log
    CustomLog ${APACHE_LOG_DIR}/careconnect_api_access.log combined
</VirtualHost>
